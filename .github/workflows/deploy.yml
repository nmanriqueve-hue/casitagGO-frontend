name: Desplegar frontend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumina-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, lumina-deploy]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p lumina up -d --build --wait
