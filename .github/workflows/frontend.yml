
name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Ejecutar pruebas y generar cobertura
        run: npx vitest run --coverage --maxWorkers=2 --coverage.reporter=lcov --coverage.reporter=text

      - name: Analizar proyecto con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - run: npm run build

      - run: docker build -t lumina:ci .
