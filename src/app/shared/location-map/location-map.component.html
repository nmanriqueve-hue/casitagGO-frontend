
@if (loading()) {
  <p>Cargando mapa...</p>
} @else if (validPoint(); as location) {
  <div
    #mapContainer
    class="location-map"
    role="region"
    aria-label="Mapa interactivo de ubicación del alojamiento">
  </div>

  <p>
    {{ location.label }} ·
    <a
      [href]="external()"
      target="_blank"
      rel="noopener noreferrer">
      Abrir mapa
    </a>
  </p>

  <small>
    © OpenStreetMap contributors.
    Requiere conexión a internet.
  </small>
} @else {
  <p>
    Este alojamiento todavía no tiene una
    ubicación en el mapa.
  </p>
}
