<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Ir al inicio">
      <span class="brand-mark">CG</span>
      <span>CasitaGo</span>
    </a>
    <button class="menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">Menú</button>
    <nav class="nav-links" [class.open]="menuOpen()">
      <a routerLink="/buscar" routerLinkActive="active" (click)="closeMenu()">Explorar</a>
      @if (session.isAuthenticated()) {
        <details #masMenu class="optional-menu"><summary>Más</summary><div>@if (session.role() !== 'admin') { <a routerLink="/mis-reservas" (click)="closeMenu(masMenu)">Mis reservas</a><a routerLink="/favoritos" (click)="closeMenu(masMenu)">Favoritos</a><a routerLink="/mensajes" (click)="closeMenu(masMenu)">Mensajes</a> }<a routerLink="/seguridad" (click)="closeMenu(masMenu)">Seguridad</a></div></details>
        <a [routerLink]="dashboardRoute()" routerLinkActive="active" (click)="closeMenu()">Mi espacio</a>
        <a routerLink="/notificaciones" routerLinkActive="active" (click)="closeMenu()">Notificaciones<app-notification-dot /></a>
        <div class="user-menu">
          <a routerLink="/perfil" (click)="closeMenu()">
            <span class="avatar">{{ session.currentUser()?.name?.charAt(0) }}</span>
            <span><small>{{ roleLabel() }}</small>{{ session.currentUser()?.name }}</span>
          </a>
          <button type="button" (click)="logout()">Salir</button>
        </div>
      } @else {
        <a routerLink="/iniciar-sesion" routerLinkActive="active" (click)="closeMenu()">Iniciar sesión</a>
        <a class="btn btn-brand btn-sm" routerLink="/registro" (click)="closeMenu()">Crear cuenta</a>
      }
    </nav>
  </div>
</header>
