<section class="page-shell"><div class="container verification panel panel-body"><p class="eyebrow">Segundo paso</p><h1>Verifica tu acceso</h1>@if (mfa.challenge(); as challenge) { <p>Cuenta: {{ challenge.email }}</p><p>Simulación: introduce <strong>123456</strong>. El código vence en 5 minutos y admite 5 intentos.</p><form (ngSubmit)="verify()"><label for="verify-code" class="form-label">Código de seis dígitos</label><input id="verify-code" class="form-control" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" [(ngModel)]="code"><p class="field-error" role="alert">{{ error() }}</p><button class="btn btn-brand" [disabled]="code.length !== 6">Verificar</button><button class="btn btn-light" type="button" (click)="cancel()">Cancelar</button></form> } @else { <p>No hay una verificación pendiente.</p><a routerLink="/iniciar-sesion">Iniciar sesión</a> }</div></section>
