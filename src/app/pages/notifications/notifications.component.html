<section class="page-shell"><div class="container notifications-wrap">
  <div class="page-heading"><div><p class="eyebrow">Actividad</p><h1>Notificaciones</h1><p>Eventos relevantes de tu cuenta, reservas y publicaciones.</p></div><button class="btn btn-outline-brand" type="button" (click)="admin.markAllNotifications()">Marcar todas como leídas</button></div>
  <div class="panel notification-list">@for (notification of admin.notifications(); track notification.id) { <button type="button" [class.unread]="!notification.read" (click)="admin.markNotification(notification.id)"><span class="notification-icon">{{ notification.type === 'booking' ? '⌂' : notification.type === 'listing' ? '◇' : notification.type === 'account' ? '○' : '✦' }}</span><span class="notification-copy"><strong>{{ notification.title }}</strong><span>{{ notification.message }}</span><small>{{ notification.date }}</small></span>@if (!notification.read) { <span class="unread-dot"></span> }</button> }</div>
</div></section>
